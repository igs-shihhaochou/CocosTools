name: Lint Check

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup lint environment
        run: |
          # Generate package.json for CI
          cat > package.json << 'PKGJSON'
          {
            "private": true,
            "scripts": {
              "lint": "eslint '**/*.ts' --ignore-pattern 'node_modules'",
              "format:check": "prettier --check '**/*.ts'"
            },
            "devDependencies": {
              "@typescript-eslint/eslint-plugin": "5.62.0",
              "@typescript-eslint/parser": "5.62.0",
              "eslint": "8.57.0",
              "eslint-config-prettier": "9.1.0",
              "eslint-plugin-n": "15.7.0",
              "eslint-plugin-prettier": "5.1.3",
              "gts": "^5.3.1",
              "prettier": "3.2.5",
              "typescript": "^5.4.3"
            }
          }
          PKGJSON

          # Generate .prettierrc.json for CI
          cat > .prettierrc.json << 'PRETTIER'
          {
            "bracketSpacing": false,
            "singleQuote": true,
            "trailingComma": "es5",
            "arrowParens": "avoid",
            "endOfLine": "lf"
          }
          PRETTIER

          # Patch .eslintrc.json: add root + extends for standalone CI
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('.eslintrc.json', 'utf8'));
            cfg.root = true;
            cfg.extends = './node_modules/gts/';
            fs.writeFileSync('.eslintrc.json', JSON.stringify(cfg, null, 2));
          "

      - run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
